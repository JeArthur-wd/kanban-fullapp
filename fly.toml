app = "kanban-studio"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PM_DB_PATH = "/data/pm.db"

[mounts]
  source = "pm_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
