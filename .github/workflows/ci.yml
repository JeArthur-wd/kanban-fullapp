name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or PR replaces the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      # Same Python as the Docker image.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv pip install --system -r requirements.txt
      - run: pytest --cov=app --cov-report=term-missing

  frontend:
    name: Frontend lint, unit tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      # Same Node as the Docker image.
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run test:unit
      - run: npm run build

  e2e:
    name: End to end against the Docker image
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build and start the image
        run: |
          docker build -t pm-app .
          # A dummy key: the app starts and the AI chat is not called by these tests.
          docker run -d --name pm-app -p 8000:8000 \
            -e OPENROUTER_API_KEY=ci-dummy-key \
            -e PM_SESSION_SECRET=ci-session-secret \
            pm-app
          for attempt in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health && exit 0
            sleep 2
          done
          docker logs pm-app
          exit 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Live backend tests
        working-directory: backend
        env:
          PM_BASE_URL: http://127.0.0.1:8000
        run: |
          uv pip install --system -r requirements.txt
          pytest tests/test_integration.py

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Playwright
        working-directory: frontend
        # The container is already on port 8000, so Playwright reuses it instead of
        # running the start script.
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Container logs
        if: failure()
        run: docker logs pm-app
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  deploy:
    name: Deploy to Fly.io
    needs: [e2e]
    # Off until the repository variable FLY_DEPLOY is set to "true" (and the FLY_API_TOKEN
    # secret exists), so production only changes once the Fly secrets are in place.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.FLY_DEPLOY == 'true'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Health check
        run: |
          for attempt in $(seq 1 20); do
            curl -sf https://kanban-studio.fly.dev/health && exit 0
            sleep 3
          done
          exit 1
